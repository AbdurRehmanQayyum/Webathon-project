<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Loading">
  <style>
    .arc { stroke-width: 7; stroke-linecap: round; transform-origin: 32px 32px; animation: spin 1.5s cubic-bezier(.65, 0, .35, 1) infinite; }
    .inner { animation-direction: reverse; }
    .node { transform-origin: 32px 32px; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(.55); } 50% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .arc, .node { animation: none; } }
  </style>
  <path class="arc" stroke="#8E1EA2" d="M48.97 15.03A24 24 0 1 0 48.97 48.97"/>
  <path class="arc inner" stroke="#C654C3" d="M40.49 23.51A12 12 0 1 0 40.49 40.49"/>
  <circle class="node" cx="32" cy="32" r="5" fill="#ED96D7"/>
</svg>
